version: 2

project_name: release-it-go

before:
  hooks:
    # No `go mod tidy` here: a release must build from the committed go.mod/go.sum.
    - go mod verify
    - go vet ./...
    - go test ./...

builds:
  - main: ./cmd/release-it-go
    binary: release-it-go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: emrefirat
    name: release-it-GO
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

# Multi-arch image on GHCR, built and pushed by buildx in one step
# (GoReleaser dockers_v2, v2.12+). Snapshot runs build per-platform images
# locally instead (`make docker-snapshot`).
dockers_v2:
  - id: ghcr
    images:
      - ghcr.io/emrefirat/release-it-go
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - docker-entrypoint.sh
    labels:
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.created": "{{ .Date }}"
    annotations:
      "org.opencontainers.image.description": "Release automation tool for Git projects"
      "org.opencontainers.image.source": "https://github.com/emrefirat/release-it-GO"

nfpms:
  - package_name: release-it-go
    homepage: "https://github.com/emrefirat/release-it-GO"
    maintainer: "emrefirat"
    description: "Release automation tool for Git projects"
    # The binary shells out to git for every operation.
    dependencies:
      - git
    formats:
      - deb
      - rpm
      - apk
