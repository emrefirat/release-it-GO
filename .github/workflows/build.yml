name: Build & Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write # GHCR push

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Safety check against accidental releases (a v* tag pushed from a
      # feature branch): refuse a tag that is not on main. It is NOT an
      # access control — whoever can push the tag can also edit this file at
      # that commit. Restrict who may create v* tags with a repository
      # ruleset and/or publish from a protected GitHub Environment.
      - name: Require the tag to be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag ${GITHUB_REF_NAME} is not reachable from main"; exit 1; }

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Multi-arch Docker image (dockers_v2 builds and pushes via buildx)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
