name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Version increment (empty = auto-detect from commits)"
        required: false
        type: choice
        options:
          - ""
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Create release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test before tagging
        run: go test ./... -count=1 -timeout 300s

      - name: Build release-it-go
        run: go build -o ./bin/release-it-go ./cmd/release-it-go

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create tag with release-it-go
        env:
          INCREMENT: ${{ inputs.increment }}
        run: |
          if [ -n "$INCREMENT" ]; then
            ./bin/release-it-go --ci -i "$INCREMENT"
          else
            ./bin/release-it-go --ci
          fi

      - name: Push commit and tag atomically
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "Pushing HEAD and tag: $TAG"
          # One transaction: either both refs land or neither does, so a
          # rejected branch push cannot leave an orphan tag behind.
          git push --atomic origin HEAD "$TAG"
